name: Mirror to Codeberg

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeberg-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Push repository mirror
    runs-on: ubuntu-latest

    steps:
      - name: Check out the complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Codeberg token is configured
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CODEBERG_TOKEN" ]; then
            echo "Missing required repository secret: CODEBERG_TOKEN" >&2
            exit 1
          fi

      - name: Mirror branches and tags to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_REPOSITORY: https://codeberg.org/postyizhan/MITE-Installer.git
          CODEBERG_USERNAME: postyizhan
        run: |
          set -euo pipefail

          # Keep the token out of the remote URL and out of the git config.
          askpass_script="$(mktemp)"
          trap 'rm -f "$askpass_script"' EXIT
          cat >"$askpass_script" <<'ASKPASS'
          #!/usr/bin/env sh
          case "$1" in
            *[Uu]sername*)
              printf '%s\n' "$CODEBERG_USERNAME"
              ;;
            *[Pp]assword*)
              printf '%s\n' "$CODEBERG_TOKEN"
              ;;
            *)
              printf '%s\n' "$CODEBERG_TOKEN"
              ;;
          esac
          ASKPASS
          chmod 700 "$askpass_script"

          git remote add codeberg "$CODEBERG_REPOSITORY"

          # Fetch every source branch into a separate namespace so the
          # currently checked-out branch cannot hide other branches.
          git fetch --prune origin \
            '+refs/heads/*:refs/mirror/heads/*' \
            '+refs/tags/*:refs/tags/*'

          export GIT_ASKPASS="$askpass_script"
          export GIT_TERMINAL_PROMPT=0

          # The leading '+' permits the Codeberg mirror to follow source-side
          # force-pushes. --prune removes branches and tags deleted on GitHub.
          git push --prune codeberg \
            '+refs/mirror/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'
